<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P300 Speller Popup</title>
    <link rel="stylesheet" href="speller_matrix.css">
</head>
<body>
    <div id="speller_matrix">
        <table>
            <tr><td id="A">A</td><td id="B">B</td><td id="C">C</td><td id="D">D</td><td id="E">E</td><td id="F">F</td></tr>
            <tr><td id="G">G</td><td id="H">H</td><td id="I">I</td><td id="J">J</td><td id="K">K</td><td id="L">L</td></tr>
            <tr><td id="M">M</td><td id="N">N</td><td id="O">O</td><td id="P">P</td><td id="Q">Q</td><td id="R">R</td></tr>
            <tr><td id="S">S</td><td id="T">T</td><td id="U">U</td><td id="V">V</td><td id="W">W</td><td id="X">X</td></tr>
            <tr><td id="Y">Y</td><td id="Z">Z</td><td id="0">0</td><td id="1">1</td><td id="2">2</td><td id="3">3</td></tr>
            <tr><td id="4">4</td><td id="5">5</td><td id="6">6</td><td id="7">7</td><td id="8">8</td><td id="9">9</td></tr>
        </table>
    </div>
    <div>
        <button class="btn-primary btn-lg" id="start">START</button>
    </div>
    <script src="speller_matrix.js"></script>
</body>
</html>
